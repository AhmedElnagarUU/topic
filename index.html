<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept Lab — My Programming Notes</title>
  <script>
    (function () {
      if (localStorage.getItem('concept-lab-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/docs.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deep: '#0a0a0f',
            surface: '#12121a',
            card: '#1a1a26',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-deep text-white">
  <div class="ambient-bg"></div>
  <div class="grid-overlay"></div>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="relative z-10 min-h-screen">
    <header class="border-b border-white/5 backdrop-blur-sm bg-deep/80 sticky top-0 z-50">
      <div class="max-w-[90rem] mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Open topic list">
            <i data-lucide="panel-left"></i>
          </button>
          <button type="button" id="sidebar-reopen" class="sidebar-reopen" aria-label="Open topic list">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
            <span>Topics</span>
          </button>
          <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center">
            <i data-lucide="book-open" class="text-indigo-400"></i>
          </div>
          <div>
            <h1 class="text-lg font-semibold tracking-tight">Concept Lab</h1>
            <p class="text-xs text-white/40">What I learn — documented</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div id="header-search" class="header-search search-wrap">
            <i data-lucide="search" class="search-icon"></i>
            <input type="search" class="search-input" placeholder="Search concepts…" aria-label="Search concepts" autocomplete="off">
            <div class="search-results" role="listbox"></div>
          </div>
          <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">
            <i data-theme-icon data-lucide="sun"></i>
            <span data-theme-label>Light</span>
          </button>
        </div>
      </div>
    </header>

    <div class="site-layout">
      <aside id="sidebar-nav" class="sidebar-nav"></aside>

      <main class="site-main">
        <section class="px-4 sm:px-6 pt-10 pb-6">
          <div class="doc-hero-index max-w-3xl">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-medium mb-6">
              <i data-lucide="notebook-pen" class="w-3.5 h-3.5"></i>
              Personal documentation
            </div>
            <h2>
              My Programming
              <span class="bg-gradient-to-r from-indigo-400 via-violet-400 to-cyan-400 bg-clip-text text-transparent">Knowledge Index</span>
            </h2>
            <p>
              Concepts I study — organized in three tiers: <strong>Fundamental</strong>, <strong>Middle</strong>, and <strong>Advanced</strong>. Start with fundamentals, then level up. Use the sidebar to jump to any topic.
            </p>

            <div id="hero-search" class="search-wrap">
              <i data-lucide="search" class="search-icon"></i>
              <input type="search" class="search-input" placeholder="Search — try &quot;event loop&quot;, &quot;jwt&quot;, &quot;mongodb&quot;…" aria-label="Search concepts" autocomplete="off">
              <div class="search-results" role="listbox"></div>
            </div>

            <div class="doc-stats" id="doc-stats"></div>
          </div>
        </section>

        <section class="px-4 sm:px-6 pb-20">
          <div id="categories-container"></div>
        </section>
      </main>
    </div>

    <footer class="border-t border-white/5 py-8">
      <div class="max-w-[90rem] mx-auto px-6 flex items-center justify-between text-xs text-white/25">
        <span>Concept Lab — My learning notes</span>
        <span class="font-mono">v0.8</span>
      </div>
    </footer>
  </div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="js/concepts-data.js"></script>
  <script src="js/sidebar-nav.js"></script>
  <script src="js/search.js"></script>
  <script src="js/index-page.js"></script>
  <script src="js/theme.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
